services:
  importer:
    build: .
    # GH_TOKEN must be a token with `repo` and `project` scopes
    environment:
      GH_TOKEN: ${GH_TOKEN:?Set GH_TOKEN (needs repo and project scopes)}
    volumes:
      # .env, the CSV file and the script are read from the project directory
      - ./:/app:ro
    working_dir: /app
